version: '3'

services:
  image-embedding:
    build:
      context: ./ImageEmbedding
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ./ImageEmbedding:/app
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    restart: unless-stopped

  omni-parser:
    build:
      context: ./OmniParser
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./OmniParser:/app
      - ./OmniParser/weights:/app/weights
    environment:
      - HTTP_PROXY=http://host.docker.internal:7890
      - HTTPS_PROXY=http://host.docker.internal:7890
      - NO_PROXY=localhost,127.0.0.1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    restart: unless-stopped
